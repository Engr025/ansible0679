- name: add ssh key for minha
  authorized_key:
    user: minha
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFfa33Bxbwk7tUVik4vsrdyQzCd8VRiAnk1cKjyO/7f6 Arshad default"

- name: generate sshd_config file from template
  tags: ssh
  template:
    src: "{{ ssh_template_file }}"
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: 0644
  notify: restart_sshd

